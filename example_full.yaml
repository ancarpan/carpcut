# ─────────────────────────────────────────────────────────────
# CarpCut — full-feature reference example
#
# This YAML references the author's private media. It will NOT render
# as-is on your machine — it exists to show how to wire up:
#   - timed shutter SFX synced to image flicker sequences
#   - vertical-image modes (blur_fill, pan)
#   - video clips with start offsets and per-clip fades
#   - audio fade-out (global tail)
#   - camera_viewfinder overlay on the opening shot
#
# Treat it as a recipe book, not a runnable demo. For a runnable demo,
# see example.yaml + make_demo_assets.py.
# ─────────────────────────────────────────────────────────────

output: my_film.mp4
basedir: /path/to/your/media   # replace with your own directory
audio_fade_out: 3

audio:
  - name: film_reel
    file: film_reel_end.mp3
    at: 0.0
    duration: 2.0
    volume: 0.90

  - name: shutter_1
    file: camera_shutter.mp3
    at: 2.0
    # full 1.431s → ends 3.431
    volume: 0.90

  - name: shutter_2
    file: camera_shutter.mp3
    at: 3.431
    # full 1.431s → ends 4.862
    volume: 0.90

  - name: soundtrack
    file: Summit_Run.mp3
    at: 4.862
    volume: 0.85

clips:

  # ── 0.000–2.000s: focus_in opening ─────────────────────────
  - file: 20260529_125545.jpg
    duration: 2.0
    effect: focus_in
    overlay: camera_viewfinder
    fade_duration: 1.5

  # ── 2.000–3.431s: 6-photo flicker #1 synced to shutter clicks ─
  - { file: IMG-20260529-WA0025.jpg, duration: 0.275, effect: none }  # pre-click lead
  - { file: IMG-20260529-WA0022.jpg, duration: 0.206, effect: none }  # click 1
  - { file: IMG-20260529-WA0021.jpg, duration: 0.205, effect: none }  # click 2
  - { file: IMG-20260529-WA0019.jpg, duration: 0.206, effect: none }  # click 3
  - { file: IMG-20260529-WA0018.jpg, duration: 0.205, effect: none }  # click 4
  - { file: IMG-20260529-WA0015.jpg, duration: 0.334, effect: none }  # click 5 + tail

  # ── 3.431–4.862s: 6-photo flicker #2 synced to shutter clicks ─
  - { file: 20260529_121648.jpg, duration: 0.275, effect: none }  # pre-click lead
  - { file: 20260529_111800.jpg, duration: 0.206, effect: none }  # click 1
  - { file: 20260529_102840.jpg, duration: 0.205, effect: none }  # click 2
  - { file: 20260529_095234.jpg, duration: 0.206, effect: none }  # click 3
  - { file: 20260529_095225.jpg, duration: 0.205, effect: none }  # click 4
  - { file: 20260529_092749.jpg, duration: 0.334, effect: fade_out, fade_duration: 0.3 }  # click 5 + tail, fade to black

