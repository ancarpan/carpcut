# ─────────────────────────────────────────────────────────────
# CarpCut — runnable demo
#
# Renders a ~15s video using placeholder JPGs generated by
# make_demo_assets.py. Run once to generate assets:
#
#     uv run python make_demo_assets.py
#
# Then render:
#
#     uv run python render.py example.yaml --preview
#
# Output: demo_preview.mp4 (or demo.mp4 without --preview).
# ─────────────────────────────────────────────────────────────

output: demo.mp4
basedir: ./demo_assets

clips:
  - file: demo_01.jpg
    duration: 3
    effect: focus_in
    overlay: camera_viewfinder
    fade_duration: 1.0

  - file: demo_02.jpg
    duration: 2.5
    effect: ken_burns
    zoom: in

  - file: demo_03.jpg
    duration: 2
    effect: vignette
    overlay: film_strip

  - file: demo_04.jpg
    duration: 2
    effect: ken_burns
    zoom: out

  - file: demo_05.jpg
    duration: 2
    effect: film_grain

  - file: demo_06.jpg
    duration: 3
    effect: fade_out
    fade_duration: 1.5
